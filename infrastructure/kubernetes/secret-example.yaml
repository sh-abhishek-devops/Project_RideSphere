apiVersion: v1
kind: Secret
metadata:
  name: ridesphere-secrets
  labels:
    app.kubernetes.io/name: ridesphere
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://ridesphere:<replace-with-password>@your-postgres-host:5432/ridesphere
  MONGODB_URL: mongodb://<replace-with-username>:<replace-with-password>@your-mongodb-host:27017
  REDIS_URL: redis://:<replace-with-password>@your-redis-host:6379/0
  CELERY_BROKER_URL: redis://:<replace-with-password>@your-redis-host:6379/0
  CELERY_RESULT_BACKEND: redis://:<replace-with-password>@your-redis-host:6379/1
  JWT_SECRET_KEY: replace-with-a-long-random-jwt-secret
