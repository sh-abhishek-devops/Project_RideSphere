apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ridesphere
  labels:
    app.kubernetes.io/name: ridesphere
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: ridesphere.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ridesphere-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ridesphere-frontend
                port:
                  number: 80
